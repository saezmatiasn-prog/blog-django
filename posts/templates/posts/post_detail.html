{% extends "base.html" %}

{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}
<article class="post-detail mx-auto">
    <a href="{% url 'posts:post_list' %}" class="btn btn-link px-0 mb-3">&larr; Volver al listado</a>

    <h1 class="mb-2">{{ post.titulo }}</h1>
    <p class="text-muted">
        Por <strong>{{ post.autor.username }}</strong> &middot; {{ post.fecha_creacion|date:"d/m/Y H:i" }}
    </p>

    <div class="post-content">
        {{ post.contenido|linebreaks }}
    </div>
</article>
{% endblock %}
