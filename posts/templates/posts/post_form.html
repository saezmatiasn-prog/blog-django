{% extends "base.html" %}

{% block title %}{% if object %}Editar post{% else %}Nuevo post{% endif %}{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto form-card">
    <div class="card-body p-4">
        <h1 class="h4 mb-4">{% if object %}Editar “{{ object.titulo }}”{% else %}Nuevo post{% endif %}</h1>

        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{% if object %}Guardar cambios{% else %}Publicar{% endif %}</button>
                <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'posts:post_list' %}{% endif %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
