{% extends "base.html" %}

{% block title %}Eliminar post{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto form-card border-danger">
    <div class="card-body p-4">
        <h1 class="h4 mb-3">Eliminar post</h1>
        <p>¿Seguro que querés eliminar <strong>“{{ object.titulo }}”</strong>? Esta acción no se puede deshacer.</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
